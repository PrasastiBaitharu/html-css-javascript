<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Calculator</title>
</head>
<body>
    <h1 id="counter"> </h1>
    
    <button id="one">1</button>
    <button id="two">2</button>
    <button id="three">3</button>
    <button id="four">4</button>
    <button id="five">5</button><br>
    <button id="six">6</button>
    <button id="seven">7</button>
    <button id="eight">8</button>
    <button id="nine">9</button>
    <button id="zero">0</button><br>
    <button id="plus" class="btn">+</button>
    <button id="minus" class="btn">-</button>
    <button id="mul" class="btn">*</button>
    <button id="div" class="btn">/</button>
    <button id="equal" class="btn">=</button>

    <script src="script.js"></script>
</body>
</html>
